      const period = document.getElementById('period').value;

        xaxis: {
          rangeslider: {visible: false},
          gridcolor: '#2f3336',
          type: 'category',  // 避免週末空白
          nticks: 12
        },
        yaxis: {
          title: '價格 (TWD)',
          gridcolor: '#2f3336',
          side: 'right',
          domain: [0.25, 1]
        },
        yaxis2: {
          title: '成交量',
          gridcolor: '#2f3336',
          domain: [0, 0.2],
          side: 'right'
        },
        legend: {
          orientation: 'h',
          y: 1.08,
          x: 0,
          bgcolor: 'rgba(0,0,0,0)'
        },
        hovermode: 'x unified'
      };
      
      const config = {
        responsive: true,
        displayModeBar: true,
        modeBarButtonsToRemove: ['lasso2d', 'select2d'],
        displaylogo: false
      };
      
      Plotly.react('chart', traces, layout, config);
    }
    
    // 初始載入
    document.addEventListener('DOMContentLoaded', updateChart);
    // 選項變更時也可即時更新
    ['period', 'interval', 'ma5', 'ma10', 'ma20'].forEach(id => {
      document.getElementById(id).addEventListener('change', updateChart);
    });
  </script>
</body>
</html>
